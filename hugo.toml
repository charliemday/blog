baseURL = 'https://charliemday.github.io/blog/'
locale = 'en-us'
title = 'Charlie Day'
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  author = 'Charlie Day'
  description = 'Notes on the future, space, and everything in between.'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 1

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 2
